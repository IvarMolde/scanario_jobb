<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Jobbportal med tydelig Lagre søk-knapp og varsel">
  <defs>
    <filter id="skygge" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#003057" flood-opacity="0.14"/>
    </filter>
    <filter id="knapp-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#EE9B00" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Bakgrunn som fyller containeren -->
  <rect width="640" height="360" rx="12" fill="#E8EEF2"/>

  <!-- Portal-ramme -->
  <rect x="16" y="14" width="608" height="332" rx="14" fill="#F7FAFC" stroke="#C5D0D6" stroke-width="2"/>

  <!-- Topplinje -->
  <rect x="16" y="14" width="608" height="42" rx="14" fill="#FFFFFF"/>
  <rect x="16" y="42" width="608" height="14" fill="#FFFFFF"/>
  <text x="34" y="42" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">jobbportalen</text>
  <circle cx="580" cy="35" r="10" fill="#D9E6EE"/>
  <circle cx="548" cy="35" r="10" fill="#D9E6EE"/>

  <!-- Søkelinje -->
  <rect x="34" y="68" width="572" height="36" rx="10" fill="#FFFFFF" stroke="#B7C6CF" stroke-width="1.5"/>
  <text x="48" y="91" fill="#6A7A85" font-family="Segoe UI, Arial, sans-serif" font-size="13">Søk etter stilling, sted eller bedrift</text>
  <circle cx="580" cy="86" r="11" fill="#003057"/>
  <circle cx="580" cy="86" r="5" fill="none" stroke="#FFF" stroke-width="2"/>
  <line x1="587" y1="93" x2="592" y2="98" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Filterkolonne -->
  <rect x="34" y="118" width="150" height="210" rx="10" fill="#FFFFFF" stroke="#D7E0E6" stroke-width="1.5"/>
  <text x="46" y="142" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Filtre</text>
  <rect x="46" y="154" width="14" height="14" rx="3" fill="#003057"/>
  <path d="M49 161 l3 3 6-7" fill="none" stroke="#FFF" stroke-width="1.8" stroke-linecap="round"/>
  <text x="68" y="166" fill="#16324A" font-family="Segoe UI, Arial, sans-serif" font-size="12">Molde</text>
  <rect x="46" y="180" width="14" height="14" rx="3" fill="#EEF4F7" stroke="#B7C6CF"/>
  <text x="68" y="192" fill="#5A6B75" font-family="Segoe UI, Arial, sans-serif" font-size="12">Vestnes</text>
  <rect x="46" y="206" width="14" height="14" rx="3" fill="#EEF4F7" stroke="#B7C6CF"/>
  <text x="68" y="218" fill="#5A6B75" font-family="Segoe UI, Arial, sans-serif" font-size="12">Aukra</text>
  <text x="46" y="250" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Omfang</text>
  <rect x="46" y="262" width="14" height="14" rx="3" fill="#003057"/>
  <path d="M49 269 l3 3 6-7" fill="none" stroke="#FFF" stroke-width="1.8" stroke-linecap="round"/>
  <text x="68" y="274" fill="#16324A" font-family="Segoe UI, Arial, sans-serif" font-size="12">Heltid / deltid</text>
  <rect x="46" y="288" width="14" height="14" rx="3" fill="#EEF4F7" stroke="#B7C6CF"/>
  <text x="68" y="300" fill="#5A6B75" font-family="Segoe UI, Arial, sans-serif" font-size="12">Deltid</text>

  <!-- Resultatområde -->
  <rect x="198" y="118" width="408" height="210" rx="10" fill="#FFFFFF" stroke="#D7E0E6" stroke-width="1.5"/>

  <!-- Tydelig Lagre søk-knapp (markert) -->
  <rect x="210" y="130" width="148" height="40" rx="10" fill="#FFF8EE" stroke="#EE9B00" stroke-width="3" filter="url(#knapp-glow)"/>
  <!-- Bokmerke-ikon -->
  <path d="M224 141 v18 l7-5 7 5 v-18 z" fill="none" stroke="#003057" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="246" y="156" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">Lagre søk</text>

  <!-- Varsel-merke ved siden av -->
  <rect x="368" y="136" width="118" height="28" rx="14" fill="#E5F4EC" stroke="#146C43" stroke-width="1.5"/>
  <circle cx="384" cy="150" r="7" fill="#146C43"/>
  <path d="M381 150 l2.2 2.2 4.5-5" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"/>
  <text x="396" y="155" fill="#0D5C3B" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Varsel er på</text>

  <!-- Sortering -->
  <text x="520" y="154" fill="#6A7A85" font-family="Segoe UI, Arial, sans-serif" font-size="11">Mest relevant ▾</text>

  <!-- Trefftekst -->
  <text x="214" y="192" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3 treff i Molde</text>

  <!-- Jobbkort 1 -->
  <g filter="url(#skygge)">
    <rect x="210" y="204" width="186" height="108" rx="10" fill="#FFFFFF" stroke="#D7E0E6"/>
  </g>
  <rect x="222" y="216" width="36" height="36" rx="8" fill="#D9E6EE"/>
  <text x="268" y="232" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Butikkmedarbeider</text>
  <text x="268" y="250" fill="#5A6B75" font-family="Segoe UI, Arial, sans-serif" font-size="11">Bunnpris · Molde</text>
  <text x="222" y="286" fill="#6A7A85" font-family="Segoe UI, Arial, sans-serif" font-size="11">Heltid · Frist 12.11</text>

  <!-- Jobbkort 2 -->
  <g filter="url(#skygge)">
    <rect x="408" y="204" width="186" height="108" rx="10" fill="#FFFFFF" stroke="#D7E0E6"/>
  </g>
  <rect x="420" y="216" width="36" height="36" rx="8" fill="#D9E6EE"/>
  <text x="466" y="232" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Pleieassistent</text>
  <text x="466" y="250" fill="#5A6B75" font-family="Segoe UI, Arial, sans-serif" font-size="11">Kirkebakken · Molde</text>
  <text x="420" y="286" fill="#6A7A85" font-family="Segoe UI, Arial, sans-serif" font-size="11">Deltid · Frist 10.11</text>

  <!-- Pekemarkør mot Lagre søk -->
  <path d="M286 98 v24" fill="none" stroke="#EE9B00" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M279 116 l7 10 7-10" fill="#EE9B00"/>
</svg>
