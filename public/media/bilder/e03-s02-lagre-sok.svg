<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Jobbportal med tydelig Lagre søk-knapp og varsel">
  <!-- Fyller hele scene-containeren (16:9) -->
  <rect width="640" height="360" fill="#E8EEF2"/>

  <!-- Portalflate -->
  <rect x="12" y="10" width="616" height="340" rx="12" fill="#F4F7FA" stroke="#C5D0D6" stroke-width="2"/>

  <!-- Topp -->
  <rect x="12" y="10" width="616" height="44" rx="12" fill="#FFFFFF"/>
  <rect x="12" y="40" width="616" height="14" fill="#FFFFFF"/>
  <text x="28" y="40" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">jobbportalen</text>
  <circle cx="584" cy="32" r="9" fill="#D9E6EE"/>
  <circle cx="556" cy="32" r="9" fill="#D9E6EE"/>

  <!-- Søkelinje -->
  <rect x="28" y="66" width="584" height="38" rx="10" fill="#FFFFFF" stroke="#B7C6CF" stroke-width="1.5"/>
  <text x="42" y="90" fill="#6A7A85" font-family="Segoe UI, Arial, sans-serif" font-size="13">Søk etter stilling, sted eller bedrift</text>
  <circle cx="586" cy="85" r="12" fill="#003057"/>
  <circle cx="586" cy="85" r="5.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="594" y1="93" x2="599" y2="98" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Filtre -->
  <rect x="28" y="116" width="156" height="220" rx="10" fill="#FFFFFF" stroke="#D7E0E6" stroke-width="1.5"/>
  <text x="40" y="140" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Filtre</text>
  <rect x="40" y="152" width="15" height="15" rx="3" fill="#003057"/>
  <path d="M43.2 159.5 l3.2 3.2 6.2-7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <text x="64" y="165" fill="#16324A" font-family="Segoe UI, Arial, sans-serif" font-size="12">Molde</text>
  <rect x="40" y="178" width="15" height="15" rx="3" fill="#EEF4F7" stroke="#B7C6CF"/>
  <text x="64" y="191" fill="#5A6B75" font-family="Segoe UI, Arial, sans-serif" font-size="12">Vestnes</text>
  <rect x="40" y="204" width="15" height="15" rx="3" fill="#EEF4F7" stroke="#B7C6CF"/>
  <text x="64" y="217" fill="#5A6B75" font-family="Segoe UI, Arial, sans-serif" font-size="12">Aukra</text>
  <text x="40" y="250" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Omfang</text>
  <rect x="40" y="262" width="15" height="15" rx="3" fill="#003057"/>
  <path d="M43.2 269.5 l3.2 3.2 6.2-7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <text x="64" y="275" fill="#16324A" font-family="Segoe UI, Arial, sans-serif" font-size="12">Heltid</text>
  <rect x="40" y="288" width="15" height="15" rx="3" fill="#EEF4F7" stroke="#B7C6CF"/>
  <text x="64" y="301" fill="#5A6B75" font-family="Segoe UI, Arial, sans-serif" font-size="12">Deltid</text>

  <!-- Resultater -->
  <rect x="198" y="116" width="414" height="220" rx="10" fill="#FFFFFF" stroke="#D7E0E6" stroke-width="1.5"/>

  <!-- Tydelig Lagre søk-knapp -->
  <rect x="212" y="128" width="168" height="44" rx="10" fill="#FFF8EE" stroke="#EE9B00" stroke-width="3.5"/>
  <path d="M228 140 v20 l8-5.5 8 5.5 v-20 z" fill="none" stroke="#003057" stroke-width="2.3" stroke-linejoin="round"/>
  <text x="254" y="156" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">Lagre søk</text>

  <!-- Varsel -->
  <rect x="392" y="136" width="124" height="28" rx="14" fill="#E5F4EC" stroke="#146C43" stroke-width="1.8"/>
  <circle cx="408" cy="150" r="7" fill="#146C43"/>
  <path d="M405 150 l2.2 2.2 4.6-5" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>
  <text x="420" y="155" fill="#0D5C3B" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Varsel er på</text>

  <text x="538" y="154" fill="#6A7A85" font-family="Segoe UI, Arial, sans-serif" font-size="11">Mest relevant</text>

  <text x="216" y="196" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3 treff i Molde</text>

  <!-- Kort 1 -->
  <rect x="212" y="208" width="188" height="112" rx="10" fill="#FFFFFF" stroke="#D7E0E6" stroke-width="1.5"/>
  <rect x="224" y="220" width="36" height="36" rx="8" fill="#D9E6EE"/>
  <text x="270" y="236" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Butikkmedarbeider</text>
  <text x="270" y="254" fill="#5A6B75" font-family="Segoe UI, Arial, sans-serif" font-size="11">Bunnpris · Molde</text>
  <text x="224" y="294" fill="#6A7A85" font-family="Segoe UI, Arial, sans-serif" font-size="11">Heltid · Frist 12.11</text>

  <!-- Kort 2 -->
  <rect x="412" y="208" width="188" height="112" rx="10" fill="#FFFFFF" stroke="#D7E0E6" stroke-width="1.5"/>
  <rect x="424" y="220" width="36" height="36" rx="8" fill="#D9E6EE"/>
  <text x="470" y="236" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Pleieassistent</text>
  <text x="470" y="254" fill="#5A6B75" font-family="Segoe UI, Arial, sans-serif" font-size="11">Kirkebakken · Molde</text>
  <text x="424" y="294" fill="#6A7A85" font-family="Segoe UI, Arial, sans-serif" font-size="11">Deltid · Frist 10.11</text>

  <!-- Pil mot knappen -->
  <path d="M296 96 v22" fill="none" stroke="#EE9B00" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M288 114 l8 12 8-12" fill="#EE9B00"/>
</svg>
